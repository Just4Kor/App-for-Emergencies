{% extends "base.html" %}

{% block content %}
<div class="auth-box">
    <h2 class="section-title">Register</h2>

    <form method="post">
        <label for="role">Account type</label>
        <select id="role" name="role" onchange="toggleFields()">
            <option value="customer">Customer</option>
            <option value="worker">Worker</option>
        </select>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <div id="customer-fields">
            <label for="city">City</label>
            <select id="city" name="city">
                {% for city in cities %}
                    <option value="{{ city }}">{{ city }}</option>
                {% endfor %}
            </select>
        </div>

        <div id="worker-fields" style="display: none;">
            <label for="specialty">Specialty</label>
            <select id="specialty" name="specialty">
                {% for specialty in specialties %}
                    <option value="{{ specialty }}">{{ specialty }}</option>
                {% endfor %}
            </select>

            <label for="location">Location</label>
            <select id="location" name="location">
                {% for location in locations %}
                    <option value="{{ location }}">{{ location }}</option>
                {% endfor %}
            </select>

            <label for="hourly_rate">Hourly rate</label>
            <input type="number" step="0.01" id="hourly_rate" name="hourly_rate">
        </div>

        <button class="btn" type="submit">Create account</button>
    </form>
</div>

<script>
function toggleFields() {
    const role = document.getElementById("role").value;
    const customerFields = document.getElementById("customer-fields");
    const workerFields = document.getElementById("worker-fields");

    if (role === "customer") {
        customerFields.style.display = "block";
        workerFields.style.display = "none";
    } else {
        customerFields.style.display = "none";
        workerFields.style.display = "block";
    }
}

window.onload = toggleFields;
</script>
{% endblock %}
