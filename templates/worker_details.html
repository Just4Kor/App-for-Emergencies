{% extends "base.html" %}

{% block content %}
<div class="detail-box">
    <span class="badge">{{ worker.specialty }}</span>
    <h2 class="section-title">{{ worker.username }}</h2>

    <p><strong>Location:</strong> {{ worker.location }}</p>
    <p><strong>Hourly rate:</strong> €{{ worker.hourly_rate }}/hour</p>
    <p><strong>Rating:</strong> {{ worker.rating }} / 5</p>

    <a class="btn btn-secondary" href="{{ url_for('home') }}">
        Back to workers
    </a>
</div>

<div class="detail-box">
    <h2 class="section-title">Send a Service Request</h2>

    <form method="post">
        <label for="title">Problem title</label>
        <input
            type="text"
            id="title"
            name="title"
            placeholder="Example: Leaking faucet"
            required
        >

        <label for="address">Problem address</label>
        <input
            type="text"
            id="address"
            name="address"
            placeholder="Example: Gedimino pr. 10, Vilnius"
            required
        >

        <label for="description">Problem description</label>
        <textarea
            id="description"
            name="description"
            placeholder="Describe your problem..."
            required
        ></textarea>

        <button class="btn" type="submit">Submit request</button>
    </form>
</div>
{% endblock %}
